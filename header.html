    <body>

        <!-- ============================================ -->
        <!-- HEADER -->
        <!-- ============================================ -->
        <header class="site-header">

            <!-- Top Utility Announcement Banner -->
            <div class="top-bar" id="siteNoticeBar">
                <div class="top-bar-inner container">
                    <div class="notice-content">
                        <span>🚚 <strong>Fast Lagos Delivery:</strong> Free shipping on orders over ₦150,000</span>
                        <span class="notice-divider">|</span>
                        <span>📦 Are you a distributor or retailer? <a href="#" data-auth="login" class="notice-link">Sign in</a> to access B2B pricing!</span>
                    </div>
                    <button type="button" class="notice-close-btn" id="closeNoticeBtn" aria-label="Dismiss notice">
                        &times;
                    </button>
                </div>
            </div>

            <div class="main-header">

                <div class="header-inner container">

                    <!-- 2. Site Branding -->
                     <div class="site-branding">
                    
                        <!-- 1. Brand Logo -->
                        <a href="index.html" class="site-logo" title="Home" aria-label="GreenCart Stores">

                            <svg class="logo-mark" aria-hidden="true">
                                <use class="use-full" href="assets/greencarts.svg#logo-full"></use>
                                <use class="use-compact" href="assets/greencarts.svg#logo-compact"></use>
                                <!--<use class="use-lone" href="assets/greencarts.svg#logo-lone"></use>-->
                            </svg>
  
                        </a>
                    
                        <!-- 4. Dynamic Wholesale Status Badge -->
                        <div id="pricing-status-pill" class="pricing-status-pill retail mobile-pill">
                            <span class="status-dot"></span>
                            <span id="pillPricingText" class="status-text">Retail</span>
                        </div>

                     </div>

                    <!-- 3. Primary Navigation -->
                    <div class="nav-bar d-none">

                        <nav id="primary-nav" class="nav-links">
                            <div class="nav-link"><a href="catalogue.html">Catalogue</a></div>
                            <div class="nav-link"><a href="contact.html">Contact</a></ div>
                        </nav>

                    </div>                    

                    <!-- 4. Dynamic Wholesale Status Badge -->
                    <div id="pricing-status-pill" class="pricing-status-pill retail desktop-pill">
                        <span class="status-dot"></span>
                        <span id="pillPricingText" class="status-text">Guest</span>
                    </div>      

                    <!-- 5. Central Search Bar -->
                    <div id="searchBar" class="search-bar">
                        <form id="searchForm" action="shop.html" method="GET" class="search-form">
                            <input id="searchInput" type="text" name="q" placeholder="Search food staples, rice, beans, garri..." autocomplete="off" required>
                            <button class="search-btn" type="submit" aria-label="Search">
                                <span title="Search" class="search-icon fa-solid fa-search" role="img"></spam>
                            </button>
                        </form>
                    </div>

                    <!-- 6. Header Action Utilities -->
                    <div class="header-buttons">
                            
                        <button id="searchToggleBtn" class="search-btn d-none" type="button" aria-label="Search">
                            <span title="Search" class="search-icon fa-solid fa-search" role="img"></spam>
                        </button>
                        
                        <!-- 1. Mobile Hamburger Toggle Button -->
                        <a href="catalogue.html" class="catalog-toggle" title="Catalogue">
                            <span class="catalog-icon fa-solid fa-list-ul"></span>
                            <span class="icon-text">Catalog</span>
                        </button>
                        
                        <!-- Cart Icon & Badge -->
                        <a href="cart.html" class="mini-cart" title="Mini Cart">
                            <div class="cart-btn">
                                <span class="cart-badge bg-amber">0</span>
                                <span class="trolley-icon fa-solid fa-cart-shopping" role="img" aria-label="Mini Cart"></span>
                            </div>
                            <span class="icon-text">Cart</span>
                        </a>

                        <!-- LOGGED-OUT STATE: Login / Register Dropdown -->
                        <div id="profile-logged-out" class="user-profile profile-login-span" title="Login/Register">

                            <button type="button" class="profile-toggle" aria-haspopup="true">
                                <span class="user-icon fa-solid fa-user" role="img" aria-label="User-Logout-Icon"></span> 
                                <span class="icon-text">Account</span>
                            </button>

                            <div class="profile-tabs">
                                <a id="simulateLoginBtn" href="login.html" class="login-btn" data-auth="login">Login</a>
                                <a id="simulateRegisterBtn" href="register.html" class="register-btn" data-auth="register">Register</a>
                            </div>

                        </div>

                        <!-- LOGGED-IN STATE: Account & Logout Display -->
                        <div id="profile-logged-in" class="user-profile profile-logout-span hide" title="Logout/Track Order">

                            <div id="userBadgeWrapper" class="profile-toggle" aria-haspopup="true">
                                <span class="user-icon fa-solid fa-user" role="img" aria-label="User-Logout-Icon"></span>                                    
                                <div class="icon-text user-greeting"> <span class="greeting-prefix">Hi,</span> <span class="user-name header-user-display"></span>                                                                    </div>
                            </div>

                            <div class="profile-tabs">
                                <a id="track-order" href="track-order.html" class="track-order" title="Track Order">Track Order</a>
                                <a id="logoutBtn" href="#" class="logout-button" title="Log out">Log Out</a>
                            </div>

                        </div>

                        <!-- 1. Mobile Hamburger Toggle Button -->
                        <button id="mobileToggle" class="mobile-toggle d-none" role="button" aria-label="Toggle Navigation">
                            ☰
                            <span class="navbar-toggler-icon fa-solid fa-list-ul"></span>
                        </button>                        

                    </div>

                </div>

            </div>

        </header>
